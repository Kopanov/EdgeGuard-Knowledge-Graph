# Runs ruff, mypy, pytest (with coverage), a Neo4j integration test, Docker build, and pip-audit on pushes/PRs.
name: CI

on:
  push:
    branches: [main, develop]
  # All pull requests (any target branch) — typical for GitHub PR workflow
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & static analysis ─────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      # PR-A audit fix (Dependency HIGH-5): pin to commit SHA, not floating
      # major tag. The tj-actions/changed-files attack (March 2025) exploited
      # the mutability of major-version tags. Renovate/Dependabot can update.
      # 2026-06: all pins bumped to Node 24 releases — GitHub forces JS
      # actions onto Node 24 from 2026-06-16 and removes Node 20 from runners
      # 2026-09-16 (upload-artifact v6+ needs runner >= 2.327.1;
      # GitHub-hosted ubuntu-latest always satisfies that).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (node24)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (node24)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff — lint
        run: ruff check src/ dags/ tests/ scripts/ plugins/

      - name: Ruff — format check
        run: ruff format --check src/ dags/ tests/ scripts/ plugins/

      - name: Mypy — type check
        run: mypy src/ scripts/ --ignore-missing-imports --no-error-summary

  # ── Unit tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (node24)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (node24)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Dummy env so src/config.py imports succeed during pytest (aligned with Makefile `make test`).
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
          MISP_URL: https://misp.local
          MISP_API_KEY: test-key-12345678901234567890
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=30

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: coverage-report
          path: coverage.xml

  # ── Real Neo4j: statements whose semantics mocks cannot show ─────────────
  # Mocked sessions cannot show what APOC's mergeNodes does to property types (its "combine" stores
  # equal values as one string), nor run the Cypher that records r.cited_ids, the EPSS / SSVC writes,
  # the attribution cleanup of build_relationships step 2d, (2026-10) the Malware ATT&CK-id twin
  # merge with the family look-ups of build_relationships 9b / 2d or the merge of an indicator whose
  # MISP last_seen was refreshed. This job runs them on a throwaway Neo4j with APOC, from the image
  # docker-compose.yml deploys. The password exists only inside this job's container.
  neo4j-integration:
    name: Neo4j integration
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.03.1-community
        env:
          NEO4J_AUTH: neo4j/edgeguard-ci-only
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "apoc.*"
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p edgeguard-ci-only 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (node24)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (node24)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: edgeguard-ci-only
          MISP_URL: https://misp.local
          MISP_API_KEY: test-key-12345678901234567890
          EDGEGUARD_IT_NEO4J_URI: bolt://localhost:7687
          EDGEGUARD_IT_NEO4J_USER: neo4j
          EDGEGUARD_IT_NEO4J_PASSWORD: edgeguard-ci-only
          EDGEGUARD_IT_NEO4J_REQUIRED: "1"
        run: pytest tests/test_actor_alias_merge_neo4j.py tests/test_explainability_neo4j.py tests/test_cve_epss_ssvc_neo4j.py tests/test_attribution_single_actor_reports_neo4j.py tests/test_export_paths_neo4j.py tests/test_malware_twin_merge_neo4j.py tests/test_reobserved_indicator_neo4j.py tests/test_node_counts_neo4j.py tests/test_entity_description_neo4j.py tests/test_description_ranking_neo4j.py tests/test_indicator_aging_neo4j.py tests/test_sector_evidence_neo4j.py tests/test_technique_flag_and_family_credit_neo4j.py tests/test_kev_update_neo4j.py tests/test_write_results_neo4j.py tests/test_cve_nvd_precedence_neo4j.py tests/test_indicator_cve_report_links_neo4j.py tests/test_clear_neo4j_script_neo4j.py -v -rs

  # ── Docker build + image vulnerability scan ───────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (node24)

      - name: Build Docker image
        run: docker build -t edgeguard-kg:ci .

      - name: Build Airflow worker image
        run: docker build -f Dockerfile.airflow -t edgeguard-airflow:ci .

      # PR-B audit fix (Dependency MED-4): pip-audit (in the security job)
      # only sees what's in requirements.txt — it MISSES OS-package CVEs in
      # the Docker base image AND transitive Python deps that the runtime
      # image picks up (e.g. Flask 2.2.5 / FAB / aiohttp / cryptography
      # bundled by the apache/airflow base image but not declared in our
      # requirements.txt). Trivy scans the actual built image's filesystem,
      # closing that blind spot.
      #
      # Severity gate: HIGH+CRITICAL fail the job; MED/LOW are reported as
      # warnings (not yet failing — we'd need to triage the airflow base
      # image's existing MED debt before turning that on). The
      # ``--ignore-unfixed`` flag skips findings with no upstream patch
      # available, so the job doesn't fire on un-actionable noise.
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy scan — edgeguard-kg image (HIGH+CRITICAL fails)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            --format table \
            edgeguard-kg:ci

      # PR-B audit fix: the airflow base image (apache/airflow:3.2.0 at the
      # time; 3.3.2 since October 2026 — that bump cleared six CRITICALs the
      # 3.2.0 base carried, see Dockerfile.airflow) carries
      # upstream debt we cannot patch from this Dockerfile (litellm CVEs,
      # openssh-client pin lag, golang stdlib in airflow's bundled providers).
      # The first Trivy run found:
      #   - litellm CVE-2026-35030 CRITICAL (auth bypass)
      #   - openssh-client CVE-2026-3497 HIGH
      #   - golang stdlib CVE-2026-32280 / 32282 / 33810 HIGH
      # Strict CRITICAL-only gate: still fail on litellm-class issues but
      # surface HIGHs as informational only. When apache/airflow refreshes
      # the base, tighten back to HIGH+CRITICAL.
      #
      # TODO(issue #52): re-tighten this gate to ``--severity HIGH,CRITICAL``
      # once (1) ``apt-get remove --purge openssh-client`` lands in
      # Dockerfile.airflow, (2) the apache-airflow-providers-* allowlist is
      # documented + enforced, (3) the upstream watch action confirms HIGH
      # debt has been resolved. Tracking: 3-agent corroborated finding from
      # the comprehensive 7-agent audit (Red Team M4, Devil's Advocate,
      # Prod Readiness B6).
      - name: Trivy scan — edgeguard-airflow image (CRITICAL fails; HIGH informational)
        run: |
          trivy image \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            --format table \
            edgeguard-airflow:ci

      # Informational HIGH/MED/LOW report on both images — does NOT fail the
      # job, just surfaces the apache/airflow base image's existing debt for
      # triage.
      - name: Trivy scan — informational (continue-on-error)
        # Also after a failed CRITICAL gate, when the report is needed for triage.
        if: always()
        continue-on-error: true
        run: |
          echo "=== edgeguard-kg HIGH/MED/LOW ==="
          trivy image --severity HIGH,MEDIUM,LOW --ignore-unfixed --no-progress --format table edgeguard-kg:ci || true
          echo "=== edgeguard-airflow HIGH/MED/LOW (HIGH not gated; see CRITICAL gate above) ==="
          trivy image --severity HIGH,MEDIUM,LOW --ignore-unfixed --no-progress --format table edgeguard-airflow:ci || true

  # ── Security scanning ─────────────────────────────────────────────────────
  security:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 (node24)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0 (node24)
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known CVEs
        run: |
          # Airflow was upgraded 2.11 → 3.2 in April 2026. The large GHSA
          # ignore list that used to live here (18 entries covering
          # apache-airflow, flask, flask-appbuilder, requests, pygments) was
          # entirely obsolete after the upgrade — pip-audit against the
          # new requirements.txt reports "No known vulnerabilities found"
          # with zero ignores.
          #
          # Flask CVE-2026-27205 (see docs/AIRFLOW_DAGS.md § "Airflow version
          # and image"): the apache/airflow:3.2.0 base
          # image bundled Flask 2.2.5 via the apache-airflow-providers-fab
          # auth manager, which this pip-install path never pulls, so
          # pip-audit could not see it; it was accepted operationally on the
          # loopback-only API binding. The 3.3.2 base (October 2026) ships
          # FAB 3.9.0 → Flask 3.1.3, so the Docker image is clear as well.
          #
          # New CVEs should be addressed by upgrading the affected package,
          # not by re-adding to this ignore list. Only add `--ignore-vuln`
          # entries as a temporary measure when the fix version is not yet
          # available, and always include a code comment explaining why
          # and a tracking ticket.
          #
          # Former ignore PYSEC-2026-161 (CVE-2026-48710 / GHSA-86qp-5c8j-p5mr,
          # Starlette Host-header auth-bypass, fixed in starlette>=1.0.1)
          # was removed in October 2026: apache-airflow-core 3.3.x requires
          # `starlette>=1.0.1` (3.2.x pinned `<1`), so the fix is installable
          # and `pip-audit -r requirements.txt` reports clean with zero
          # ignores again. Tracking issue #121 can be closed.
          # NOTE: ``--format json --output <file>`` (NOT ``--output json -o
          # <file>`` — ``-o`` IS ``--output``, so that form set the output
          # FILE twice and left the format as ``columns``, and pip-audit
          # skips writing the columns file entirely when no vulnerabilities
          # are found — the artifact upload below then warned "No files were
          # found"). The json format always writes the file, including the
          # full dependency listing on a clean run.
          pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Upload audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: pip-audit
          path: pip-audit.json
