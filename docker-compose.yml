# ================================================================================
# EdgeGuard Full Stack — docker-compose.yml
#
# Services:
#   neo4j            — shared graph database (ports 7474 HTTP, 7687 Bolt)
#   airflow_postgres — Airflow metadata DB only (PostgreSQL, internal — no host port)
#   airflow          — DAG orchestration (port 8082 — avoids ResilMesh Temporal on 8080)
#   api              — EdgeGuard REST API (port 8000)
#   graphql          — EdgeGuard GraphQL API (port 4001 — mirrors ISIM GraphQL convention)
#
# Usage:
#   cp .env.example .env && nano .env        # fill in real secrets
#   docker compose build airflow             # bake Python deps (neo4j, pymisp, …) — required after clone or requirements change
#   docker compose up -d                     # start all services
#   docker compose logs -f graphql           # tail a specific service
#
# For Prometheus + Grafana monitoring:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Required environment variables (see .env.example):
#   NEO4J_PASSWORD, MISP_URL, MISP_API_KEY, EDGEGUARD_API_KEY
#   MISP_URL: default in compose is https://misp.local — that hostname usually does NOT resolve inside
#   containers. Set MISP_URL in .env to your MISP container/service URL (shared Docker network).
# Optional (Airflow metadata DB — defaults shown):
#   AIRFLOW_POSTGRES_USER, AIRFLOW_POSTGRES_PASSWORD, AIRFLOW_POSTGRES_DB
# Optional: AIRFLOW_MEMORY_LIMIT (default 12g) — raise if full_neo4j_sync gets SIGKILL (-9) under Docker cgroup limits
# Optional Neo4j JVM / cgroup (defaults in neo4j service): NEO4J_HEAP_INITIAL, NEO4J_HEAP_MAX, NEO4J_PAGECACHE,
#   NEO4J_CONTAINER_MEMORY_LIMIT — see docs/DOCKER_SETUP_GUIDE.md
# Optional MISP→Neo4j tuning (passed via x-common-env to airflow/api/graphql — set in .env):
#   EDGEGUARD_NEO4J_SYNC_CHUNK_SIZE, EDGEGUARD_REL_BATCH_SIZE, EDGEGUARD_DEBUG_GC, EDGEGUARD_MISP_EVENT_SEARCH
# ================================================================================

x-common-env: &common-env
  NEO4J_URI: bolt://neo4j:7687
  # HTTP API (Browser / transactional endpoint) for optional DAG curl checks — not the Bolt URI.
  NEO4J_HTTP: ${NEO4J_HTTP:-http://neo4j:7474}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  # Host-only /etc/hosts setups use misp.local; from inside Compose services set .env, e.g.
  # https://<compose_project>_<misp_service>_1:443 (see docs/MISP_SOURCES.md).
  MISP_URL: ${MISP_URL:-https://misp.local}
  MISP_API_KEY: ${MISP_API_KEY:-}
  # When MISP_URL uses Docker DNS but Apache vhost ServerName differs (e.g. localhost, misp-edgeguard).
  EDGEGUARD_MISP_HTTP_HOST: ${EDGEGUARD_MISP_HTTP_HOST:-}
  # Must be set for Airflow + API + GraphQL (collectors / MISPWriter / health). Unset = verify ON.
  EDGEGUARD_SSL_VERIFY: ${EDGEGUARD_SSL_VERIFY:-true}
  EDGEGUARD_API_KEY: ${EDGEGUARD_API_KEY:-}
  # Optional: comma-separated allowlist of collectors (see .env.example / docs/AIRFLOW_DAGS.md)
  EDGEGUARD_COLLECT_SOURCES: ${EDGEGUARD_COLLECT_SOURCES:-}
  # Trust allowlist for foreign MISP events (src/source_trust.py): .env.example says "configure at
  # least one in production" — without forwarding it was silently bypassed inside the containers.
  EDGEGUARD_TRUSTED_MISP_ORG_UUIDS: ${EDGEGUARD_TRUSTED_MISP_ORG_UUIDS:-}
  EDGEGUARD_TRUSTED_MISP_ORG_NAMES: ${EDGEGUARD_TRUSTED_MISP_ORG_NAMES:-}
  # Collector API keys — leave blank to skip that source
  OTX_API_KEY: ${OTX_API_KEY:-}
  NVD_API_KEY: ${NVD_API_KEY:-}
  VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
  ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
  THREATFOX_API_KEY: ${THREATFOX_API_KEY:-}
  # DAG misp_health_check: optional stricter worker check; emergency skip (see docs/AIRFLOW_DAGS.md)
  EDGEGUARD_MISP_HEALTH_REQUIRE_WORKERS: ${EDGEGUARD_MISP_HEALTH_REQUIRE_WORKERS:-}
  EDGEGUARD_SKIP_MISP_PREFLIGHT: ${EDGEGUARD_SKIP_MISP_PREFLIGHT:-}
  # edgeguard_baseline DAG: optional smoke-test overrides (see docs/BASELINE_SMOKE_TEST.md)
  EDGEGUARD_BASELINE_DAYS: ${EDGEGUARD_BASELINE_DAYS:-}
  EDGEGUARD_BASELINE_COLLECTION_LIMIT: ${EDGEGUARD_BASELINE_COLLECTION_LIMIT:-}
  # MISP→Neo4j: items per Python sync chunk (default 500 in code); lower to reduce OOM. "0" or "all" = single pass (risky).
  EDGEGUARD_NEO4J_SYNC_CHUNK_SIZE: ${EDGEGUARD_NEO4J_SYNC_CHUNK_SIZE:-}
  # Relationship UNWIND batch for create_misp_relationships_batch (default 2000 in code if unset/empty).
  EDGEGUARD_REL_BATCH_SIZE: ${EDGEGUARD_REL_BATCH_SIZE:-}
  # Opt-in gc.collect() after each node merge chunk (diagnostics; leave unset in production).
  EDGEGUARD_DEBUG_GC: ${EDGEGUARD_DEBUG_GC:-}
  # restSearch substring for EdgeGuard event discovery (default EdgeGuard in code if unset).
  EDGEGUARD_MISP_EVENT_SEARCH: ${EDGEGUARD_MISP_EVENT_SEARCH:-}
  # Issue #62: min fraction of ATTEMPTED MISP pushes that must succeed or the
  # collector task fails RED (default 0.95 in code; 0 disables the gate).
  EDGEGUARD_MISP_MIN_SUCCESS_RATE: ${EDGEGUARD_MISP_MIN_SUCCESS_RATE:-}
  # 2026-10 fresh-baseline train — optional sources and levers (set in .env; defaults mirror src/config.py).
  # Without these lines a value in .env never reached the airflow container, so the two ICS sources
  # could not be enabled on the Compose deployment. Ints that the code parses with int() get an
  # explicit default here: set-but-empty would raise at import.
  EDGEGUARD_ENABLE_MITRE_ICS: ${EDGEGUARD_ENABLE_MITRE_ICS:-false}
  MITRE_ICS_ATTACK_URL: ${MITRE_ICS_ATTACK_URL:-}
  MITRE_FORCE_REFETCH: ${MITRE_FORCE_REFETCH:-}
  EDGEGUARD_MITRE_CONDITIONAL_GET: ${EDGEGUARD_MITRE_CONDITIONAL_GET:-true}
  EDGEGUARD_ENABLE_CISA_ICS: ${EDGEGUARD_ENABLE_CISA_ICS:-false}
  EDGEGUARD_CISA_ICS_INCREMENTAL_DAYS: ${EDGEGUARD_CISA_ICS_INCREMENTAL_DAYS:-30}
  EDGEGUARD_CISA_ICS_MAX_ADVISORIES_PER_RUN: ${EDGEGUARD_CISA_ICS_MAX_ADVISORIES_PER_RUN:-}
  EDGEGUARD_CISA_ICS_MIN_EXPECTED_ADVISORIES: ${EDGEGUARD_CISA_ICS_MIN_EXPECTED_ADVISORIES:-}
  EDGEGUARD_CISA_INCREMENTAL_DAYS: ${EDGEGUARD_CISA_INCREMENTAL_DAYS:-30}
  EDGEGUARD_NVD_INCREMENTAL_DAYS: ${EDGEGUARD_NVD_INCREMENTAL_DAYS:-14}
  EDGEGUARD_DEFAULT_TLP: ${EDGEGUARD_DEFAULT_TLP:-white}
  EDGEGUARD_ENABLE_ACTOR_ALIAS_MERGE: ${EDGEGUARD_ENABLE_ACTOR_ALIAS_MERGE:-true}
  # 2026-10 configuration forwarding (production-readiness check): variables read by the code
  # that never reached the containers. Set-but-empty keeps the code default in every case below.
  # Environment name — config.is_production_env() is fail-closed: unset or empty is treated as
  # production (API key required, documentation routes key-gated); set dev / staging in .env for
  # non-production stacks. Previously the value in .env never reached the containers.
  EDGEGUARD_ENV: ${EDGEGUARD_ENV:-}
  # Neo4j database for every session (multi-database servers only; empty = the server default).
  NEO4J_DATABASE: ${NEO4J_DATABASE:-}
  # REST and GraphQL CORS allowlist (same default as the code).
  EDGEGUARD_CORS_ORIGINS: ${EDGEGUARD_CORS_ORIGINS:-http://localhost,http://localhost:3000}
  # REST and GraphQL request body cap in bytes (code default 1048576; the parsers tolerate empty).
  EDGEGUARD_MAX_BODY_BYTES: ${EDGEGUARD_MAX_BODY_BYTES:-}

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Neo4j — graph database
  # ─────────────────────────────────────────────────────────────────────────────
  neo4j:
    # Neo4j moved to CalVer with the 2026.x release line (was 5.x). The
    # Python driver pinned in requirements*.txt is still on the 5.x line
    # and is wire-compat with 2026.x server per Neo4j's official matrix
    # (https://neo4j.com/developer/kb/neo4j-supported-versions/) — driver
    # bump to 6.x is a separate PR.
    # See ``src/version_compatibility.py::RECOMMENDED_VERSIONS`` for the
    # canonical pin table; ``edgeguard doctor`` warns if the running
    # server drifts from this tag.
    image: neo4j:2026.03.1-community
    container_name: edgeguard_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser (HTTP) — loopback only
      - "127.0.0.1:7687:7687"   # Bolt protocol — loopback only
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      # Memory — JVM + pagecache; Docker limit must exceed heap + pagecache + OS headroom (see DOCKER_SETUP_GUIDE.md)
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
      # Per-transaction memory cap — prevents one bad UNWIND query from exhausting the heap
      NEO4J_dbms_memory_transaction_total_max: ${NEO4J_TX_MEMORY_MAX:-4g}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    deploy:
      resources:
        limits:
          # PR-A audit fix (Prod Readiness HIGH): default bumped 4g→8g. The
          # 4g default was too small for any baseline run (the per-tx max alone
          # is 4g per ${NEO4J_TX_MEMORY_MAX:-4g} above, leaving zero headroom
          # for heap+pagecache+OS); fresh-clone deployments would OOM on the
          # first ``docker compose up`` baseline. 8g matches the JVM-default
          # math (heap_max 2g + pagecache 1g + tx_max 4g + ~1g OS = 8g floor).
          # Production deployments should still set NEO4J_CONTAINER_MEMORY_LIMIT
          # explicitly per docs/DOCKER_SETUP_GUIDE.md (recommended 32g for the
          # 730d baseline workload).
          memory: ${NEO4J_CONTAINER_MEMORY_LIMIT:-8g}
    networks:
      - edgeguard_net
    healthcheck:
      # PR-A audit fix (Prod Readiness HIGH): the previous ``wget --spider`` test
      # checked HTTP port 7474 was OPEN — but a Neo4j in disk-full read-only
      # mode keeps the HTTP listener up while refusing all writes, so the
      # service shows ``healthy`` while every Cypher write fails. Replace with
      # cypher-shell that creates+deletes a sentinel node — proves writability
      # AND auth in one round-trip. The sentinel is _HC label (no schema
      # collision) and DELETE is idempotent.
      # PR-A audit fix (Bugbot MED on commit f60e213): quote BOTH env vars
      # so passwords containing shell metacharacters ($, &, ;, spaces, etc.)
      # don't break the healthcheck. Without quoting, e.g. NEO4J_PASSWORD="a&b"
      # would split mid-arg and the healthcheck would fail with a confusing
      # auth error rather than the actual writability test.
      #
      # PR-A audit fix (Bugbot LOW on commit 8ab02ac): drop the
      # EG_NEO4J_USER / EG_NEO4J_PASSWORD aliases that duplicated the
      # credentials already in NEO4J_AUTH as separate env vars (visible
      # to every process in the container). Parse NEO4J_AUTH directly
      # using POSIX shell parameter expansion (``${VAR%%/*}`` =
      # everything before first ``/``; ``${VAR#*/}`` = everything after
      # first ``/``). dash supports both per POSIX spec — the prior
      # comment claiming this was "/bin/sh-fragile" was incorrect.
      # Result: one fewer copy of the password on disk + in process env.
      test: ["CMD-SHELL",
             "cypher-shell -u \"$${NEO4J_AUTH%%/*}\" -p \"$${NEO4J_AUTH#*/}\" 'CREATE (n:_HC) DELETE n' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─────────────────────────────────────────────────────────────────────────────
  # Airflow metadata DB — PostgreSQL (required for LocalExecutor)
  #
  # Airflow metadata must use a database that supports concurrent access (here: Postgres).
  # This Postgres service is internal-only (no host port); credentials default to
  # airflow/airflow — override via AIRFLOW_POSTGRES_* in .env for production.
  # ─────────────────────────────────────────────────────────────────────────────
  airflow_postgres:
    image: postgres:16-alpine
    container_name: edgeguard_airflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - edgeguard_net
    healthcheck:
      # $$ expands to $ in the container — use image env (POSTGRES_USER / POSTGRES_DB)
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          # PR-A audit fix (Prod Readiness MED): default bumped 512m→2g. Airflow
          # 3.x emits per-task heartbeats every 30s × 11 collectors during a
          # baseline running 24h+; a 512m metadata DB is undersized for that
          # write load and leads to slow scheduler queries (visible as DAG
          # task scheduling latency). 2g matches typical Airflow 3.x guidance
          # for a single-node LocalExecutor stack.
          memory: ${AIRFLOW_POSTGRES_MEMORY_LIMIT:-2g}

  # ─────────────────────────────────────────────────────────────────────────────
  # Airflow — DAG orchestration (standalone: webserver + scheduler + triggerer)
  #
  # NOTE: Port 8082 is intentional. ResilMesh's Temporal workflow service uses
  # port 8080 (the Airflow default). See .env.example for details.
  #
  # Metadata DB is PostgreSQL (airflow_postgres) — see service above. SQLite is not used for Airflow in this stack.
  #
  # Python packages for DAGs (neo4j, pymisp, collectors, …) are NOT installed at runtime — they are in
  # requirements-airflow-docker.txt and baked by Dockerfile.airflow. Do not pip install inside the container;
  # recreate would drop them. After pulling code or changing that file: docker compose build airflow && docker compose up -d airflow
  # ─────────────────────────────────────────────────────────────────────────────
  # One-shot permission fix for the bind-mounted state directories (same pattern as the official
  # Airflow Compose file): Docker creates missing host directories as root, and the Airflow
  # container runs as uid 50000, which could then not write its checkpoints and sync state.
  airflow-init:
    image: edgeguard-airflow:3.3.2-python3.12
    container_name: edgeguard_airflow_init
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/airflow/state /opt/airflow/checkpoints
        # One-time migration for deployments created before the bind mounts: the airflow_db volume
        # (mounted read-only at /legacy) may still hold the sync state file and the collector
        # checkpoints at these paths. Copy them into the host directories without overwriting
        # anything already there, so the recorded sync watermark and the resume points are not
        # hidden by the new mounts (a hidden state file would trigger a full sync and a
        # re-collection from scratch).
        # The two process-held lock files are not migrated: they belong to processes of the
        # previous container (a different hostname), where the dead-PID pruning cannot see them,
        # and a copied baseline_in_progress.lock would make the scheduled DAGs skip for up to the
        # lock age cap (48 h) although no baseline runs.
        for d in state checkpoints; do
          if [ -d "/legacy/$d" ]; then
            find "/legacy/$d" -mindepth 1 -maxdepth 1 \
              ! -name baseline_in_progress.lock ! -name pipeline.lock \
              -exec cp -an {} "/opt/airflow/$d/" \; || true
          fi
        done
        chown -R 50000:0 /opt/airflow/state /opt/airflow/checkpoints
        chmod -R u+rwX,g+rwX /opt/airflow/state /opt/airflow/checkpoints
    volumes:
      - ./state:/opt/airflow/state
      - ./checkpoints:/opt/airflow/checkpoints
      - airflow_db:/legacy:ro
    networks:
      - edgeguard_net

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: edgeguard-airflow:3.3.2-python3.12
    container_name: edgeguard_airflow
    restart: unless-stopped
    # Dockerfile.airflow CMD is `airflow standalone` (tini as PID 1). Do not set `command: standalone`
    # — that would override CMD and break the entrypoint chain.
    # Note: in Airflow 3.x `airflow standalone` runs the scheduler + API
    # server + DAG processor + triggerer in one process, same as 2.x.
    # For a split-process production deployment, switch to separate
    # `airflow scheduler` / `airflow api-server` services — out of scope
    # for this single-node compose stack.
    init: true
    ports:
      - "127.0.0.1:8082:8082"   # Airflow UI — loopback only
      # Metrics are served by the `metrics` service below (127.0.0.1:8001), not by task processes.
    environment:
      <<: *common-env
      # Mounted repo src at /opt/airflow/src — ensure all PythonOperator imports resolve without relying only on DAG sys.path hacks.
      PYTHONPATH: /opt/airflow/src
      # Airflow 3.x config key for the API server port is
      # `AIRFLOW__API__PORT` — the port moved from the [webserver] section
      # to the [api] section when the webserver was split into a separate
      # API server process. There is NO `[api_server]` config section in
      # Airflow (an earlier version of this compose file set a
      # non-existent `AIRFLOW__API_SERVER__WEB_SERVER_PORT`, which
      # silently did nothing — caught by bugbot on PR #26).
      # The old AIRFLOW__WEBSERVER__WEB_SERVER_PORT is kept as well so
      # the variable is harmless if a stale Airflow 2.x image is ever
      # pulled by accident during rollback.
      AIRFLOW__API__PORT: "8082"
      # Airflow 3.x internal Execution API URL. The scheduler/executor
      # builds the execution_api_server_url from [api] base_url; if
      # base_url is unset, the fallback is http://localhost:8080/ — NOT
      # derived from [api] port. That means task execution would try to
      # reach the API server on 8080 while it actually listens on 8082
      # (from AIRFLOW__API__PORT above), producing "connection refused"
      # on every task. Set base_url explicitly to match the port.
      AIRFLOW__API__BASE_URL: "http://localhost:8082"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8082"
      # The Airflow 3.x API server requires an explicit JWT secret (it signs the
      # tokens issued by POST /auth/token and the execution API tokens) — without
      # it the API server fails to start ("jwt_secret not set"). Generate once with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(64))"
      # and put the value in .env as AIRFLOW_API_AUTH_JWT_SECRET. A
      # stable secret is required across restarts so issued tokens
      # stay valid.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_AUTH_JWT_SECRET:-}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # psycopg2 driver is bundled in the official apache/airflow image
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow_postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      # Long collectors (e.g. NVD 15–30+ min) exceed Airflow's default zombie threshold (~600s).
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: ${AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD:-3600}
      # Heartbeats + zombie scan: default local_task_job_heartbeat_sec=0 makes heartbeat interval fall back
      # to scheduler_zombie_task_threshold (see Airflow 2.7+ docs) — bad for LocalExecutor clarity. Explicit
      # 30s heartbeats; 60s zombie scan (default 10s) reduces scheduler churn during heavy task startup.
      AIRFLOW__SCHEDULER__LOCAL_TASK_JOB_HEARTBEAT_SEC: ${AIRFLOW__SCHEDULER__LOCAL_TASK_JOB_HEARTBEAT_SEC:-30}
      AIRFLOW__SCHEDULER__ZOMBIE_DETECTION_INTERVAL: ${AIRFLOW__SCHEDULER__ZOMBIE_DETECTION_INTERVAL:-60}
      # Use Fernet key for secrets — generate with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW_CONN_NEO4J_DEFAULT: ${AIRFLOW_CONN_NEO4J_DEFAULT:-}
      # Prometheus metrics (2026-10): PROMETHEUS_MULTIPROC_DIR switches prometheus_client to its
      # multi-process mode — every Airflow task process writes its metric values to this shared
      # directory and the `metrics` service below aggregates and serves them on 127.0.0.1:8001.
      # Without it, LocalExecutor task processes each held a private registry that Prometheus
      # never scraped. EDGEGUARD_ENABLE_METRICS only matters for the in-process server used on
      # bare-metal single-process installs.
      PROMETHEUS_MULTIPROC_DIR: /opt/airflow/metrics_multiproc
      EDGEGUARD_ENABLE_METRICS: ${EDGEGUARD_ENABLE_METRICS:-false}
      EDGEGUARD_METRICS_HOST: ${EDGEGUARD_METRICS_HOST:-0.0.0.0}
      EDGEGUARD_METRICS_PORT: "8001"
      # Slack alerting on task failures (dags/edgeguard_pipeline.py callbacks).
      # Both webhook var spellings pass through — .env.example documents
      # "either var works" and send_slack_alert checks both.
      EDGEGUARD_ENABLE_SLACK_ALERTS: ${EDGEGUARD_ENABLE_SLACK_ALERTS:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      AIRFLOW__SLACK__WEBHOOK_URL: ${AIRFLOW__SLACK__WEBHOOK_URL:-}
      # Neo4j-sync cadence guard (see should_run_neo4j_sync): tolerance window
      # subtracted from NEO4J_SYNC_INTERVAL when deciding whether to skip.
      EDGEGUARD_SYNC_INTERVAL_TOLERANCE_MIN: ${EDGEGUARD_SYNC_INTERVAL_TOLERANCE_MIN:-}
      # Minimum number of MISP events the Neo4j sync must find in its window
      # (src/run_misp_to_neo4j.py). Unset / 0 disables the guard: a zero-event
      # window is logged as a WARNING and still counts as a successful run.
      EDGEGUARD_SYNC_MIN_EVENTS: ${EDGEGUARD_SYNC_MIN_EVENTS:-}
      # MISP push accounting: attributes absent from the returned event are reported; with this
      # flag they also count as failed pushes (feeds EDGEGUARD_MISP_MIN_SUCCESS_RATE).
      EDGEGUARD_MISP_STRICT_PUSH_ACCOUNTING: ${EDGEGUARD_MISP_STRICT_PUSH_ACCOUNTING:-}
      # Backup-timestamp gate for the destructive baseline_clean DAG task
      # (UI/API triggers; the CLI wrapper checks these on the host instead).
      EDGEGUARD_LAST_BACKUP_AT: ${EDGEGUARD_LAST_BACKUP_AT:-}
      EDGEGUARD_BACKUP_MAX_AGE_HOURS: ${EDGEGUARD_BACKUP_MAX_AGE_HOURS:-}
      # Orphan-process safeguard (src/parent_dag_liveness.py) calls the Airflow REST API (/api/v2,
      # bearer token from POST /auth/token) from inside the task. With the password unset the client
      # reads the password file the Simple auth manager generates in AIRFLOW_HOME, so the probe works
      # without any .env entry; set both variables to use a dedicated API user. Kept on the airflow
      # service only (not x-common-env) so api/graphql never see the Airflow password.
      AIRFLOW_API_VERSION: ${AIRFLOW_API_VERSION:-v2}
      AIRFLOW_API_USER: ${AIRFLOW_API_USER:-admin}
      AIRFLOW_API_PASSWORD: ${AIRFLOW_API_PASSWORD:-}
      EDGEGUARD_PARENT_DAG_LIVENESS_CHECK: ${EDGEGUARD_PARENT_DAG_LIVENESS_CHECK:-true}
      EDGEGUARD_LIVENESS_CHECK_INTERVAL_SEC: ${EDGEGUARD_LIVENESS_CHECK_INTERVAL_SEC:-}
      AIRFLOW_WEBSERVER_URL: ${AIRFLOW_WEBSERVER_URL:-http://localhost:8082}
      # MISP push / sync tuning knobs documented in .env.example (2026-10 configuration forwarding).
      # Variables the code parses with int()/float() carry the code default here, because a
      # set-but-empty value would raise at import; the others tolerate empty.
      EDGEGUARD_MISP_PUSH_BATCH_SIZE: ${EDGEGUARD_MISP_PUSH_BATCH_SIZE:-}
      EDGEGUARD_MISP_BATCH_THROTTLE_SEC: ${EDGEGUARD_MISP_BATCH_THROTTLE_SEC:-}
      EDGEGUARD_MISP_EVENT_FETCH_THROTTLE_SEC: ${EDGEGUARD_MISP_EVENT_FETCH_THROTTLE_SEC:-}
      EDGEGUARD_MISP_EVENT_LOCK_PATH: ${EDGEGUARD_MISP_EVENT_LOCK_PATH:-/tmp/edgeguard_misp_get_or_create_event.lock}
      EDGEGUARD_MAX_EVENT_ATTRIBUTES: ${EDGEGUARD_MAX_EVENT_ATTRIBUTES:-50000}
      EDGEGUARD_MISP_PAGE_SIZE: ${EDGEGUARD_MISP_PAGE_SIZE:-500}
      EDGEGUARD_MISP_MAX_PAGES: ${EDGEGUARD_MISP_MAX_PAGES:-100}
      EDGEGUARD_MISP_RETRY_COOLDOWN_SEC: ${EDGEGUARD_MISP_RETRY_COOLDOWN_SEC:-15.0}
      EDGEGUARD_MISP_MAX_ATTR_VALUE_BYTES: ${EDGEGUARD_MISP_MAX_ATTR_VALUE_BYTES:-4096}
      EDGEGUARD_SYNC_INTERVAL_DAYS: ${EDGEGUARD_SYNC_INTERVAL_DAYS:-3}
      EDGEGUARD_EARLIEST_IOC_DATE: ${EDGEGUARD_EARLIEST_IOC_DATE:-}
      EDGEGUARD_MITRE_MAX_RELATIONSHIPS: ${EDGEGUARD_MITRE_MAX_RELATIONSHIPS:-}
      EDGEGUARD_SUBPROCESS_TAIL_LINES: ${EDGEGUARD_SUBPROCESS_TAIL_LINES:-}
      EDGEGUARD_BASELINE_LOCK_MAX_AGE_SEC: ${EDGEGUARD_BASELINE_LOCK_MAX_AGE_SEC:-}
      # Operations-only escape hatches (truthy values disable a safeguard; leave unset in production).
      EDGEGUARD_DISABLE_MERGE_COUNTER_INSPECTION: ${EDGEGUARD_DISABLE_MERGE_COUNTER_INSPECTION:-}
      EDGEGUARD_RESPECT_CALIBRATOR: ${EDGEGUARD_RESPECT_CALIBRATOR:-}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow_logs:/opt/airflow/logs
      - airflow_db:/opt/airflow
      - metrics_multiproc:/opt/airflow/metrics_multiproc
      # Shared with the host (2026-10): the sync state file, the collector checkpoints and the
      # baseline lock sentinel live here. Before this, they lived only in the airflow_db volume and
      # the host CLI (doctor, monitor, stats, checkpoint status) read empty host directories.
      # airflow-init below creates the directories owned by the container user (uid 50000).
      - ./state:/opt/airflow/state
      - ./checkpoints:/opt/airflow/checkpoints
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      airflow_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # LocalExecutor + standalone runs sync in-process; full MISP→Neo4j can spike RSS.
          # Large MISP events (100K+ attributes) need 8-12GB. Default 12g for production safety.
          memory: ${AIRFLOW_MEMORY_LIMIT:-12g}
    networks:
      - edgeguard_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # ─────────────────────────────────────────────────────────────────────────────
  # EdgeGuard REST API — FastAPI on port 8000
  # ─────────────────────────────────────────────────────────────────────────────
  # ------------------------------------------------------------------------------
  # Metrics exporter (2026-10) — aggregates the per-process metric files the Airflow
  # task processes write to PROMETHEUS_MULTIPROC_DIR and serves /metrics on 8001.
  # Same image as airflow (the exporter only needs prometheus_client and src/).
  # ------------------------------------------------------------------------------
  metrics:
    image: edgeguard-airflow:3.3.2-python3.12
    container_name: edgeguard_metrics
    restart: unless-stopped
    depends_on:
      airflow:
        condition: service_started
    command: ["python", "-m", "src.metrics_exporter"]
    working_dir: /opt/airflow
    ports:
      - "127.0.0.1:8001:8001"   # prometheus/prometheus.yml scrapes host.docker.internal:8001
    environment:
      PROMETHEUS_MULTIPROC_DIR: /opt/airflow/metrics_multiproc
      EDGEGUARD_METRICS_HOST: 0.0.0.0   # inside the container; the host mapping above is loopback-only
      EDGEGUARD_METRICS_PORT: "8001"
      PYTHONPATH: /opt/airflow/src
    volumes:
      - ./src:/opt/airflow/src:ro
      - metrics_multiproc:/opt/airflow/metrics_multiproc
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - edgeguard_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeguard-kg:latest
    container_name: edgeguard_api
    restart: unless-stopped
    # PR-A audit fix (Red Team HIGH): use the ``__main__`` block in
    # src/query_api.py instead of the uvicorn CLI flags, so the EDGEGUARD_API_HOST
    # / EDGEGUARD_API_KEY safety check (lines 88-102 of src/query_api.py) actually
    # gates the bind. The previous ``--host 0.0.0.0`` CLI flag bypassed the env-var
    # check: the Python module saw EDGEGUARD_API_HOST=127.0.0.1 (default), the A6
    # check passed, then uvicorn bound 0.0.0.0 anyway — making the API reachable
    # from any other container on edgeguard_net WITHOUT auth. Now: the module
    # reads EDGEGUARD_API_HOST at startup, the safety check refuses to start
    # unless either EDGEGUARD_API_KEY is set OR the host is loopback OR the
    # operator opts in via EDGEGUARD_ALLOW_UNAUTH=1.
    #
    # PR-A audit fix (Red Team CRITICAL C1, follow-up): the safety check has
    # to remain at 0.0.0.0 in compose because Docker port-forwarding from
    # ``ports: 127.0.0.1:8000:8000`` requires the container app to bind to
    # 0.0.0.0 (binding to the container's own 127.0.0.1 makes the docker
    # bridge unable to deliver traffic). To keep ``./install.sh && docker
    # compose up`` from crashlooping on the safety check, install.sh now
    # auto-generates a strong EDGEGUARD_API_KEY in .env on first creation
    # (see ``install.sh:71-100`` and the comment block in .env.example).
    # Operators who clone + ``docker compose up`` without install.sh hit
    # the safety check's RuntimeError with an actionable message.
    command: ["python", "-m", "src.query_api"]
    ports:
      - "127.0.0.1:8000:8000"   # REST API — host loopback only; use a reverse proxy for external access
    environment:
      <<: *common-env
      EDGEGUARD_API_HOST: ${EDGEGUARD_API_HOST:-0.0.0.0}
      EDGEGUARD_API_PORT: "8000"
      # PR-A audit fix (Bugbot MED on commit 8dde4de): the symmetric
      # EDGEGUARD_GRAPHQL_WORKERS=2 was set on the graphql service below,
      # but EDGEGUARD_API_WORKERS was forgotten — the api service would
      # fall back to the __main__ default of 1, halving the production
      # throughput posture compared to the pre-refactor ``--workers 2``
      # CLI flag we removed. Restore parity.
      EDGEGUARD_API_WORKERS: "2"
      EDGEGUARD_ENABLE_ADMIN_QUERY: ${EDGEGUARD_ENABLE_ADMIN_QUERY:-false}
      EDGEGUARD_ADMIN_TOKEN: ${EDGEGUARD_ADMIN_TOKEN:-}
      # PR-A audit fix (Bugbot MED on commit b2c0479): the .env.example
      # documents EDGEGUARD_ALLOW_UNAUTH=1 as the "LAST RESORT" escape
      # hatch when an operator wants to bypass the api/graphql safety
      # check (src/query_api.py:96 + src/graphql_api.py:101). But Compose
      # only forwards explicitly listed env vars to containers — without
      # this line, setting EDGEGUARD_ALLOW_UNAUTH=1 in .env had NO effect
      # and the container kept crashing with the documented RuntimeError.
      # Forward it explicitly so the documented escape hatch works.
      EDGEGUARD_ALLOW_UNAUTH: ${EDGEGUARD_ALLOW_UNAUTH:-}
      PYTHONPATH: /app/src
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - edgeguard_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # EdgeGuard GraphQL API — Strawberry/FastAPI on port 4001
  #
  # Port 4001 mirrors the ISIM GraphQL service in ResilMesh deployments,
  # making EdgeGuard queryable in the same way as ISIM.
  #
  # GraphQL Playground (GraphiQL) is available at http://localhost:4001/graphql
  # in development. Disable in production:  EDGEGUARD_GRAPHQL_PLAYGROUND=false
  # ─────────────────────────────────────────────────────────────────────────────
  graphql:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgeguard-kg:latest
    container_name: edgeguard_graphql
    restart: unless-stopped
    # PR-A audit fix (Red Team HIGH): symmetric with ``api`` above — invoke the
    # Python module directly so the EDGEGUARD_GRAPHQL_HOST env-var safety check
    # actually gates the bind. The previous ``--host 0.0.0.0`` CLI flag bypassed
    # the env check.
    command: ["python", "-m", "src.graphql_api"]
    ports:
      - "127.0.0.1:4001:4001"   # GraphQL API — loopback only
    environment:
      <<: *common-env
      EDGEGUARD_GRAPHQL_PORT: "4001"
      EDGEGUARD_GRAPHQL_HOST: ${EDGEGUARD_GRAPHQL_HOST:-0.0.0.0}
      EDGEGUARD_GRAPHQL_WORKERS: "2"
      # Set to "false" in production to disable the interactive GraphiQL explorer
      EDGEGUARD_GRAPHQL_PLAYGROUND: ${EDGEGUARD_GRAPHQL_PLAYGROUND:-false}
      # Query depth cap of the GraphQL validation rules (code default when empty).
      EDGEGUARD_GRAPHQL_MAX_DEPTH: ${EDGEGUARD_GRAPHQL_MAX_DEPTH:-}
      # PR-A audit fix (Bugbot MED on commit b2c0479): symmetric with the
      # api service above — forward EDGEGUARD_ALLOW_UNAUTH so the .env.example
      # escape hatch documentation actually works for graphql too.
      EDGEGUARD_ALLOW_UNAUTH: ${EDGEGUARD_ALLOW_UNAUTH:-}
      PYTHONPATH: /app/src
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - edgeguard_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:4001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ================================================================================
# Volumes
# ================================================================================
volumes:
  neo4j_data:
  metrics_multiproc:
  neo4j_logs:
  neo4j_plugins:
  airflow_logs:
  airflow_db:
  airflow_postgres_data:

# ================================================================================
# Networks
# ================================================================================
networks:
  edgeguard_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
